name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste passwords, app-specific passwords or personal content** (mails, events, contacts) into an issue. Claude Desktop logs (`~/Library/Logs/Claude/mcp-server-*.log`) contain the full tool results, so only copy status and error lines from them.
  - type: input
    id: version
    attributes:
      label: iClaude version
      description: Shown in Claude Desktop under Settings > Extensions.
      placeholder: "0.2.3"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: macOS and Claude Desktop version
      placeholder: "macOS 27.0, Claude Desktop (version from About)"
    validations:
      required: true
  - type: input
    id: tool
    attributes:
      label: Affected tool
      placeholder: "e.g. create_event"
  - type: textarea
    id: what
    attributes:
      label: What happened and what did you expect?
      description: Include the exact error message if there is one.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can it be reproduced?
      description: Use made-up data, for example a test calendar.
